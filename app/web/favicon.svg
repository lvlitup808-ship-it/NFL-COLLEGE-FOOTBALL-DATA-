<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>FIELDMIND</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#16212a"/>
      <stop offset="1" stop-color="#070a0d"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#3db7d4" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#3db7d4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#3db7d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphere"><circle cx="32" cy="32" r="19"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="19" fill="url(#core)" stroke="#3db7d4" stroke-width="2.2"/>
    <g clip-path="url(#sphere)" stroke="#3db7d4" stroke-opacity=".6" stroke-width="1.2">
      <ellipse cx="32" cy="32" rx="7.5" ry="19"/>
      <ellipse cx="32" cy="32" rx="14" ry="19"/>
      <path d="M32 13v38"/>
      <path d="M13 32h38"/>
      <ellipse cx="32" cy="22.5" rx="16.5" ry="2.6"/>
      <ellipse cx="32" cy="41.5" rx="16.5" ry="2.6"/>
    </g>
    <ellipse cx="32" cy="32" rx="28" ry="8.5" transform="rotate(-24 32 32)" stroke="#c6e35a" stroke-width="1.8"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="56.4" cy="21.2" r="2.6" fill="#c6e35a"/>
    <circle cx="25" cy="22.5" r="1.5" fill="#e8eef2"/>
    <circle cx="39.5" cy="41.5" r="1.5" fill="#f2a43a"/>
  </g>
