name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fieldmind
          POSTGRES_DB: fieldmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:fieldmind@127.0.0.1:5432/fieldmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python entrypoints
        run: python -m py_compile app/main.py app/ingest/nflverse.py scripts/seed.py scripts/migrate.py scripts/ingest_nflverse.py scripts/benchmark.py
      - name: Run API and adapter tests
        run: python -m pytest -q
      - name: Apply database migrations
        run: python scripts/migrate.py
      - name: Seed demo database
        run: python scripts/seed.py
      - name: Exercise idempotent nflverse ingest
        run: |
          python scripts/ingest_nflverse.py --season 2025 --url tests/fixtures/nflverse_sample.csv
          second=$(python scripts/ingest_nflverse.py --season 2025 --url tests/fixtures/nflverse_sample.csv)
          echo "$second"
          echo "$second" | grep -q '"rows_inserted":0'
          echo "$second" | grep -q '"rows_updated":3'
      - name: Run V1 query benchmark gate
        run: python scripts/benchmark.py --iterations 3 --warmup 1
      - name: Build production Docker image
        run: docker build -t fieldmind-ci .
      - name: Smoke production container
        run: |
          docker run -d --name fieldmind-ci -p 8000:8000 -e PORT=8000 fieldmind-ci
          health_ok=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              health_ok=1
              break
            fi
            sleep 1
          done
          if [ "$health_ok" -ne 1 ]; then
            docker logs fieldmind-ci
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          ready_code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8000/ready)
          test "$ready_code" = "503"
          grep -q '"status":"not_ready"' /tmp/ready.json
      - name: Container logs on failure
        if: failure()
        run: docker logs fieldmind-ci || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f fieldmind-ci || true
