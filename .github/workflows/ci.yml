name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fieldmind
          POSTGRES_DB: fieldmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:fieldmind@127.0.0.1:5432/fieldmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python entrypoints
        run: >-
          python -m py_compile
          app/main.py app/pilot.py app/wedge.py app/ingest/nflverse.py app/ingest/cfbd.py
          scripts/seed.py scripts/migrate.py scripts/provision_pilot_user.py scripts/ingest_nflverse.py
          scripts/ingest_cfbd.py scripts/benchmark.py scripts/data_quality.py
      - name: Run API and adapter tests
        run: python -m pytest -q
      - name: Apply database migrations
        run: python scripts/migrate.py
      - name: Seed demo database
        run: python scripts/seed.py
      - name: Exercise idempotent nflverse ingest
        run: |
          python scripts/ingest_nflverse.py --season 2025 --url tests/fixtures/nflverse_sample.csv
          second=$(python scripts/ingest_nflverse.py --season 2025 --url tests/fixtures/nflverse_sample.csv)
          echo "$second"
          echo "$second" | grep -q '"rows_inserted":0'
          echo "$second" | grep -q '"rows_updated":3'
      - name: Exercise idempotent CFBD college ingest
        run: |
          python scripts/ingest_cfbd.py --season 2025 --week 1 --fixture tests/fixtures/cfbd_sample.json
          second=$(python scripts/ingest_cfbd.py --season 2025 --week 1 --fixture tests/fixtures/cfbd_sample.json)
          echo "$second"
          echo "$second" | grep -q '"rows_inserted":0'
          echo "$second" | grep -q '"rows_updated":3'
      - name: Verify PBP cannot populate trusted film fields
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'])
              bad = await conn.fetchval("""
                  SELECT COUNT(*) FROM plays
                  WHERE external_source IN ('cfbd','nflverse')
                    AND (play_family <> 'UNKNOWN'
                         OR formation <> 'UNKNOWN'
                         OR personnel_offense <> 'UNKNOWN'
                         OR motion IS NOT NULL
                         OR concept IS NOT NULL
                         OR coverage IS NOT NULL)
              """)
              classified = await conn.fetchval("""
                  SELECT COUNT(*) FROM plays
                  WHERE external_source IN ('cfbd','nflverse')
                    AND source_play_class IN ('pass','run')
              """)
              await conn.close()
              assert bad == 0, bad
              assert classified >= 1, classified
          asyncio.run(main())
          PY
      - name: Run source data quality gate
        run: python scripts/data_quality.py
      - name: Run V1 query benchmark gate
        run: python scripts/benchmark.py --iterations 3 --warmup 1
      - name: Build production Docker image
        run: docker build -t fieldmind-ci .
      - name: Smoke production container
        run: |
          docker run -d --name fieldmind-ci -p 8000:8000 -e PORT=8000 fieldmind-ci
          health_ok=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              health_ok=1
              break
            fi
            sleep 1
          done
          if [ "$health_ok" -ne 1 ]; then
            docker logs fieldmind-ci
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ | grep -q 'FIELDMIND'
          ready_code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8000/ready)
          test "$ready_code" = "503"
          grep -q '"status":"not_ready"' /tmp/ready.json
      - name: Container logs on failure
        if: failure()
        run: docker logs fieldmind-ci || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f fieldmind-ci || true
