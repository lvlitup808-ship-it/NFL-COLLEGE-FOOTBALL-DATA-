services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fieldmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fieldmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fieldmind"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - fieldmind-postgres:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:fieldmind@db:5432/fieldmind
      CFBD_API_KEY: ${CFBD_API_KEY:-}
      PORT: "8000"
      PILOT_HIDE_DOCS: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  fieldmind-postgres:
