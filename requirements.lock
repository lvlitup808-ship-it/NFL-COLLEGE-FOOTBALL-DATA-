# Exact, verified dependency set for reproducible builds.
#
# requirements.txt declares supported RANGES for humans; this file pins the
# resolution that CI actually tested, so a rebuild weeks later installs the
# same bytes instead of silently drifting to newer releases.
#
# Resolved and verified on Python 3.12 (matches Dockerfile python:3.12-slim).
#
# Regenerate after changing requirements.txt:
#   python3.12 -m venv /tmp/lockenv
#   /tmp/lockenv/bin/pip install -r requirements.txt
#   /tmp/lockenv/bin/pip freeze > requirements.lock
#   (then re-add this header and re-run CI)

